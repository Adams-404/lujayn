name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generate the database source before formatting and tests.
      - name: Generate Drift code
        run: dart run build_runner build

      - name: Capture Dart formatter output (temporary diagnostic)
        run: |
          dart format lib/features/reminders/data/services/android_reminder_alarm_scheduler.dart lib/features/reminders/domain/services/reminder_schedule_planner.dart lib/features/reminders/presentation/controllers/reminder_providers.dart lib/features/reminders/presentation/screens/reminder_form_screen.dart test/features/reminders/domain/services/reminder_schedule_planner_test.dart
          git diff -- lib/features/reminders/data/services/android_reminder_alarm_scheduler.dart lib/features/reminders/domain/services/reminder_schedule_planner.dart lib/features/reminders/presentation/controllers/reminder_providers.dart lib/features/reminders/presentation/screens/reminder_form_screen.dart test/features/reminders/domain/services/reminder_schedule_planner_test.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
