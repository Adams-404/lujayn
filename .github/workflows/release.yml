name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build universal and ARM64 APKs
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release') || contains(github.event.head_commit.message, 'Release')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify quality gate
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Build universal release APK
        run: |
          flutter build apk --release
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Lujayn-universal.apk

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Keep ARM64 release APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Lujayn-arm64-v8a.apk
          ls -lh release-assets/

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Lujayn ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: |
            release-assets/Lujayn-universal.apk
            release-assets/Lujayn-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
